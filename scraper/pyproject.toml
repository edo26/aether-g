[project]
name = "aether-g-scraper"
version = "0.1.0"
description = "API for scraping NASA Physical Sciences Informatics (PSI) datasets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pandas>=3.1.1",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
